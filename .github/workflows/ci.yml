name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @he-status/shared

      - name: Typecheck backend
        run: npx tsc -p backend/tsconfig.json --noEmit

      - name: Typecheck poller
        run: npx tsc -p poller/tsconfig.json --noEmit

      - name: Run tests
        run: npm test

      - name: Lint frontend
        run: npm run lint --workspace=frontend

      - name: Build frontend
        run: npx next build
        working-directory: frontend
